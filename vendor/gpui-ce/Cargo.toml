[package]
edition = "2024"
rust-version = "1.95"
name = "gpui-ce"
version = "0.3.0"
authors = ["Nathan Sobo <nathan@zed.dev>"]
build = "build.rs"
publish = true
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A community fork of Zed's GPU-accelerated UI framework"
homepage = "https://gpui-ce.github.io/"
readme = "README.md"
keywords = [
    "desktop",
    "gui",
    "immediate",
]
categories = ["gui"]
license = "Apache-2.0"
repository = "https://github.com/gpui-ce/gpui-ce"

[package.metadata.docs.rs]
features = ["test-support"]

[package.metadata.cargo-shear]
ignored = [
    "getrandom",
    "objc2",
    "objc2-metal",
    "tracing",
]
ignored-paths = [
    "src/_ownership_and_data_flow.rs",
    "benches/focus_cleanup.rs",
]

[features]
bench = ["bench-support"]
bench-support = [
    "profiler",
    "dep:criterion",
    "dep:libc",
    "dep:perf-event",
]
custom-gpu = []
default = [
    "font-kit",
    "wayland",
    "x11",
    "windows-manifest",
    "image-default-formats",
]
embedded-assets = ["dep:rust-embed"]
font-kit = []
hot-patching = [
    "dep:dioxus-devtools",
    "dep:subsecond",
]
image-default-formats = ["image/default-formats"]
inspector = ["gpui_macros/inspector"]
leak-detection = []
profiler = ["dep:hdrhistogram"]
screen-capture = ["dep:windows-capture"]
stacker = ["dep:stacksafe"]
test-support = [
    "leak-detection",
    "collections/test-support",
    "wayland",
    "x11",
    "proptest",
    "dep:futures-concurrency",
    "dep:postage",
    "dep:web-time",
]
wayland = []
wgpu-surfaces = []
windows-manifest = ["dep:embed-resource"]
x11 = []

[lib]
name = "gpui"
path = "src/gpui.rs"
doctest = true

