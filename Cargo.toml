[package]
name = "vampir"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Lit widget toolkit for GPUI: buttons, fields, pop-ups, menus and a text input, over a small OKLCH palette."
repository = "https://github.com/404oops/vampir"
homepage = "https://github.com/404oops/vampir"
documentation = "https://docs.rs/vampir"
readme = "README.md"
keywords = ["gpui", "gui", "widgets", "ui", "toolkit"]
categories = ["gui"]
exclude = ["docs/", ".github/", "tools/"]

[features]
default = ["app-icon", "native"]
# Setting the application icon at runtime. The widgets need none of it, so
# `default-features = false` gets back to a crate with two dependencies:
#
#   vampir = { version = "0.2", default-features = false }
app-icon = ["dep:image", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]
# What a host that embeds a live native view needs: menus, hints and
# dialogs in windows of their own, because a native view covers anything
# drawn inside the GPUI window; a cover that stands a still of the view in
# for it while an overlay is up; file pickers, alerts and the other things
# only AppKit can do. macOS only; on the other platforms the feature is
# empty. Everything it pulls in is already in the tree by way of GPUI's own
# backend, so it costs nothing to compile on a machine that builds GPUI.
native = [
    "dep:async-channel",
    "dep:block2",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
    "dep:raw-window-handle",
]

[dependencies]
# For `native`: the channel a floating menu or a dialog answers on, and the
# handle that finds the AppKit window behind a GPUI one. Both are GPUI's own
# dependencies, at GPUI's versions.
async-channel = { version = "2", optional = true }
raw-window-handle = { version = "0.6", optional = true }
# Round caps and joins on stroked paths. GPUI re-exports lyon's stroke
# options but not the cap and join enums they are set with; this is the
# same lyon GPUI tessellates with, so it adds nothing to the build.
lyon_tessellation = "1"
# gpui-ce is the community edition of Zed's GPUI (Apache-2.0): the same API,
# synced from Zed and published to crates.io, which is what lets this crate be
# published too. Imported as `gpui` so the code reads as GPUI code.
gpui = { package = "gpui-ce", version = "0.2.2" }
unicode-segmentation = "1"

# Only for `app-icon`, and only on the platform that wants them. Both are
# already in the tree by way of GPUI's own backends, so on a machine that
# builds GPUI at all they cost nothing to compile.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, features = [
    "NSAlert",
    "NSApplication",
    "NSBitmapImageRep",
    "NSBox",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSMenu",
    "NSMenuItem",
    "NSOpenPanel",
    "NSPanel",
    "NSResponder",
    "NSSavePanel",
    "NSScreen",
    "NSTextField",
    "NSUserInterfaceItemIdentification",
    "NSView",
    "NSWindow",
    "NSWorkspace",
    "block2",
    "objc2-core-foundation",
    "objc2-core-graphics",
] }
objc2-foundation = { version = "0.3", optional = true, features = [
    "NSArray",
    "NSBundle",
    "NSCalendar",
    "NSData",
    "NSDate",
    "NSDateFormatter",
    "NSDictionary",
    "NSEnumerator",
    "NSError",
    "NSFormatter",
    "NSGeometry",
    "NSNotification",
    "NSObject",
    "NSString",
    "NSURL",
    "NSValue",
] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
image = { version = "0.25", optional = true, default-features = false, features = [
    "png",
] }

[dev-dependencies]
# The examples open a real window; gpui itself is platform-agnostic and the
# backend lives here. `runtime_shaders` compiles the Metal shaders when the
# app starts instead of at build time, so a machine with only the command line
# tools — no full Xcode — can build the gallery.
gpui_ce_platform = { version = "0.1.0", features = [
    "font-kit",
    "runtime_shaders",
    "wayland",
    "x11",
] }

[[example]]
name = "gallery"
path = "examples/gallery.rs"

[profile.release]
lto = "thin"
