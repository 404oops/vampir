name: Release

# Pushing a tag such as v0.2.0 runs the checks, publishes a GitHub release and
# publishes the crate to crates.io.
#
# GPUI comes from the gpui-ce registry release. The publish job guards
# against accidentally restoring a git dependency, which crates.io rejects.
#
# Authentication is crates.io Trusted Publishing: no token is stored here. On
# crates.io, under the crate's settings, add this repository and workflow file
# as a trusted publisher once, and the job mints a short-lived token itself.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: The tag is the version in Cargo.toml
        run: |
          version="$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag v$tag does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --example gallery

  github-release:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Vampir $GITHUB_REF_NAME" \
            --generate-notes

  crates-io:
    needs: check
    runs-on: macos-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Every dependency comes from a registry
        run: |
          if awk '/^\[dependencies\]/{on=1;next} /^\[/{on=0} on' Cargo.toml | grep -q 'git ='; then
            echo "A [dependencies] entry comes from git; crates.io only accepts registry dependencies." >&2
            echo "gpui is the gpui-ce release on crates.io for exactly this reason. Point the dependency at a registry version, then re-tag." >&2
            exit 1
          fi

      - name: Package
        run: cargo publish --dry-run --no-default-features

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish
        run: cargo publish --no-default-features
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
